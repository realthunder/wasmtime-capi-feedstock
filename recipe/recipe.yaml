context:
  version: "48.0.1"
  # The library's binary interface changes with wasmtime's major version,
  # and that is also the SONAME this package stamps on.
  soversion: "48"
  build: 0

package:
  name: wasmtime-capi
  version: ${{ version }}

# The upstream RELEASE ARTIFACT, not a source build. wasmtime is Rust, and
# building the C API from source means a cargo build of Cranelift and the
# whole runtime -- twenty minutes and a network fetch of several hundred
# crates -- to arrive at the same library the project already publishes and
# signs for every platform. What this recipe adds is the packaging the
# tarball lacks: a SONAME, an @rpath install name, and the version symlinks
# a conda prefix expects. See README.md.
source:
  - if: linux and x86_64
    then:
      url: https://github.com/bytecodealliance/wasmtime/releases/download/v${{ version }}/wasmtime-v${{ version }}-x86_64-linux-c-api.tar.xz
      sha256: 67683d04b416a8b91f0e607e7b4c22bd32f18f947c10b5372eb8c277ae3b883a
  - if: linux and aarch64
    then:
      url: https://github.com/bytecodealliance/wasmtime/releases/download/v${{ version }}/wasmtime-v${{ version }}-aarch64-linux-c-api.tar.xz
      sha256: 1c521a9be661644541158b360df8f7c7ec5bc2d88d23ff4dbbc12f639247c266
  - if: osx and x86_64
    then:
      url: https://github.com/bytecodealliance/wasmtime/releases/download/v${{ version }}/wasmtime-v${{ version }}-x86_64-macos-c-api.tar.xz
      sha256: a5d92170718d41e4bd08173049019f0cedb318d0156365a52667d4a35ea3ca69
  - if: osx and arm64
    then:
      url: https://github.com/bytecodealliance/wasmtime/releases/download/v${{ version }}/wasmtime-v${{ version }}-aarch64-macos-c-api.tar.xz
      sha256: 9e3c636ed487a41026ff76388c5fa6f3a48ea0968408d033ed4b5e8082c20d69
  - if: win
    then:
      url: https://github.com/bytecodealliance/wasmtime/releases/download/v${{ version }}/wasmtime-v${{ version }}-x86_64-windows-c-api.zip
      sha256: 40bd84d36dfaa1e0a9658fbb16377952a116469cc2ebe61c1ca6e4ad07104989

build:
  number: ${{ build }}
  script:
    - if: win
      then: bld.bat
      else: build.sh
  # A prebuilt artifact: nothing here was compiled against this prefix, so
  # there is no compiler and no stdlib to pin. It links only libc and the
  # system threading library.
  dynamic_linking:
    binary_relocation: true

requirements:
  build:
    - if: linux
      then: patchelf
  run_exports:
    # wasmtime breaks its C ABI across major versions and keeps it within
    # one, which is exactly what the SONAME says.
    - ${{ pin_subpackage('wasmtime-capi', upper_bound='x') }}

tests:
  - package_contents:
      include:
        - wasmtime.h
        - wasi.h
        - wasmtime/config.h
      lib:
        - wasmtime
  # Compiles and RUNS a consumer: it creates an engine with the wasm
  # exception-handling proposal enabled, which is the one capability the
  # package exists to provide -- a wasmtime without it links and then fails
  # at the first module. Native-only: on a cross build the binary cannot
  # execute, and that says nothing about the package.
  - if: build_platform == target_platform
    then:
      script:
        - if: win
          then: cmake -G Ninja -B build -S test_consumer -DCMAKE_BUILD_TYPE=Release
          else: cmake -G Ninja -B build -S test_consumer -DCMAKE_BUILD_TYPE=Release
        - cmake --build build
        - ctest --test-dir build --output-on-failure
      requirements:
        run:
          - ${{ compiler('c') }}
          - ${{ stdlib('c') }}
          - cmake
          - ninja
      files:
        recipe:
          - test_consumer/

about:
  homepage: https://wasmtime.dev/
  repository: https://github.com/bytecodealliance/wasmtime
  documentation: https://docs.wasmtime.dev/c-api/
  license: Apache-2.0 WITH LLVM-exception
  license_file: LICENSE
  summary: The wasmtime WebAssembly runtime, C API for embedding
  description: |
    wasmtime is the Bytecode Alliance's WebAssembly runtime. This package is
    the C API an application embeds to run WebAssembly inside its own
    process: compile or load a module, give it a WASI view of the world,
    link host functions into it, and call its exports.

    Packaged here because embedding a wasm runtime is a way to run untrusted
    code with the isolation enforced by the runtime rather than by policy --
    the guest reaches only the imports it was given and the directories it
    was preopened, and nothing else in the host process. FreeCAD uses it that
    way for expression and spreadsheet Python.

    Built with the WebAssembly exception-handling proposal available, which
    a guest needs for C++ exceptions to work at all.
