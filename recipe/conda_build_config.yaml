# Where the build resolves deps from, and where the artifact is labelled
# for.  Kept here rather than only in the rendered .ci_support files so a
# `conda smithy rerender` cannot reset them (the arrangement
# freecad-rt-feedstock and smesh-feedstock use).
#
# Nothing here is built against a realthunder package -- the build needs
# patchelf on linux and nothing else -- so conda-forge is the only source,
# which also keeps strict channel priority out of the way.
channel_sources:
  - conda-forge
channel_targets:
  - realthunder main

# The upstream linux artifact needs glibc 2.28 (measured: the highest
# GLIBC_ symbol version it imports).  conda-forge's default pinning is
# 2.17, and taking it would make the package claim a compatibility it does
# not have -- the failure lands on the user's machine as an unresolved
# symbol, not here.  Nothing is compiled against this sysroot; it exists
# so `stdlib('c')` emits a truthful `__glibc` constraint.
c_stdlib_version:                    # [linux]
  - '2.28'                           # [linux]
